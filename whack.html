<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#fff}
        a.back{position:fixed;top:1rem;left:1rem;color:#888;text-decoration:none;font-size:.9rem}
        a.back:hover{color:#fff}
        .header{margin-bottom:1rem;text-align:center}
        .header h1{font-size:2rem;margin-bottom:.5rem}
        .info{display:flex;gap:2rem;font-size:1.1rem}
        .info span{font-weight:bold}
        #grid{display:grid;grid-template-columns:repeat(3,110px);gap:12px;margin-bottom:1.5rem}
        .hole{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#2a2a4a 60%,#1a1a2e);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:3rem;transition:transform .1s}
        .hole:active{transform:scale(.95)}
        .hole .mole{display:none;animation:pop .3s}
        .hole.active .mole{display:block}
        .hole .hit{display:none;font-size:2rem}
        .hole.hit-anim .hit{display:block}
        .hole.hit-anim .mole{display:none}
        @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
        .btn-row{display:flex;gap:.8rem}
        .btn-row button{padding:.5rem 1.5rem;border:none;background:#6c63ff;color:#fff;border-radius:8px;cursor:pointer;font-size:1rem}
        .btn-row button:hover{background:#5a52d5}
        #timer-bar{width:332px;height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin-bottom:1rem;overflow:hidden}
        #timer-fill{height:100%;background:#6c63ff;transition:width .1s linear;border-radius:4px}
    </style>
</head>
<body>
    <a class="back" href="index.html">&larr; Menu</a>
    <div class="header">
        <h1>Whack-a-Mole</h1>
        <div class="info"><span>Score: <span id="score">0</span></span><span>Time: <span id="time">30</span>s</span><span>Best: <span id="best">0</span></span></div>
    </div>
    <div id="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
    <div id="grid"></div>
    <div class="btn-row"><button onclick="startGame()">Start</button></div>
    <script>
    let score,gameTime,gameInterval,moleInterval,best=0;
    const g=document.getElementById('grid');
    function render(){g.innerHTML='';for(let i=0;i<9;i++){const d=document.createElement('div');d.className='hole';d.innerHTML='<span class="mole">🐹</span><span class="hit">💥</span>';d.onclick=()=>whack(i);g.appendChild(d);}}
    function startGame(){
        score=0;gameTime=30;document.getElementById('score').textContent=0;document.getElementById('time').textContent=30;
        render();clearInterval(gameInterval);clearInterval(moleInterval);
        moleInterval=setInterval(showMole,800);
        gameInterval=setInterval(()=>{
            gameTime--;document.getElementById('time').textContent=gameTime;
            document.getElementById('timer-fill').style.width=(gameTime/30*100)+'%';
            if(gameTime<=0){clearInterval(gameInterval);clearInterval(moleInterval);
                if(score>best){best=score;document.getElementById('best').textContent=best;}
                document.getElementById('timer-fill').style.width='0%';
            }
        },1000);
    }
    function showMole(){
        const holes=document.querySelectorAll('.hole');
        holes.forEach(h=>h.classList.remove('active'));
        const idx=Math.floor(Math.random()*9);
        holes[idx].classList.add('active');
        setTimeout(()=>holes[idx].classList.remove('active'),600);
    }
    function whack(i){
        const holes=document.querySelectorAll('.hole');
        if(!holes[i].classList.contains('active'))return;
        holes[i].classList.remove('active');holes[i].classList.add('hit-anim');
        score++;document.getElementById('score').textContent=score;
        setTimeout(()=>holes[i].classList.remove('hit-anim'),300);
    }
    render();
    </script>
</body>
</html>
