<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1024</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            user-select: none;
        }
        a.back { position: fixed; top: 1rem; left: 1rem; color: #888; text-decoration: none; font-size: 0.9rem; z-index: 5; }
        a.back:hover { color: #fff; }
        .header { display: flex; align-items: center; gap: 2rem; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; }
        .scores { display: flex; gap: 1rem; }
        .score-box {
            background: rgba(255,255,255,0.08);
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            text-align: center;
        }
        .score-box small { font-size: 0.7rem; color: #aaa; display: block; }
        .score-box span { font-size: 1.3rem; font-weight: bold; }
        .btn-row { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; }
        .btn-row button {
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-row button:hover { background: rgba(255,255,255,0.2); }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 12px;
        }
        .cell {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            background: rgba(255,255,255,0.06);
            transition: background 0.15s;
        }
        .msg {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 10;
        }
        .msg.show { display: flex; }
        .msg h2 { font-size: 2rem; margin-bottom: 1rem; }
        .msg button {
            padding: 0.7rem 2rem; font-size: 1rem;
            border: none; background: #6c63ff; color: #fff;
            border-radius: 8px; cursor: pointer;
        }
        .hint { margin-top: 1.5rem; font-size: 0.8rem; color: #666; }
        .score-add {
            position: fixed; font-size: 1.2rem; font-weight: bold;
            color: #f5a623; pointer-events: none; z-index: 20;
        }
    </style>
</head>
<body>
    <a class="back" href="index.html">&larr; Menu</a>
    <div class="header">
        <h1>1024</h1>
        <div class="scores">
            <div class="score-box"><small>Score</small><span id="score">0</span></div>
            <div class="score-box"><small>Best</small><span id="best">0</span></div>
        </div>
    </div>
    <div class="btn-row">
        <button onclick="newGame()">New Game</button>
        <button onclick="undoMove()">Undo</button>
    </div>
    <div class="board" id="board"></div>
    <div class="msg" id="msg">
        <h2 id="msgText"></h2>
        <button onclick="newGame()">Try Again</button>
    </div>
    <p class="hint">Swipe or use arrow keys to play</p>

    <script>
    let grid, score, best = 0, prevGrid, prevScore;

    function newGame() {
        grid = Array.from({length:4}, ()=>Array(4).fill(0));
        score = 0;
        prevGrid = null; prevScore = 0;
        document.getElementById('msg').classList.remove('show');
        addRandom(); addRandom();
        render();
    }

    function undoMove() {
        if (prevGrid) { grid = prevGrid.map(r=>[...r]); score = prevScore; render(); }
    }

    function addRandom() {
        const empty = [];
        for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!grid[r][c]) empty.push([r,c]);
        if (!empty.length) return;
        const [r,c] = empty[Math.floor(Math.random()*empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function getColor(val) {
        const map = {
            0:'rgba(255,255,255,0.06)', 2:'#eee4da', 4:'#ede0c8', 8:'#f2b179',
            16:'#f59563', 32:'#f67c5f', 64:'#f65e3b', 128:'#edcf72',
            256:'#edcc61', 512:'#edc850', 1024:'#edc53f', 2048:'#edc22e'
        };
        return map[val] || '#3c3a32';
    }

    function getTextColor(val) {
        return val <= 4 ? '#776e65' : '#f9f6f2';
    }

    function render() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const v = grid[r][c];
            cell.style.background = getColor(v);
            cell.style.color = getTextColor(v);
            cell.textContent = v || '';
            if (v >= 128) cell.style.fontSize = v >= 1024 ? '1.3rem' : '1.5rem';
            boardEl.appendChild(cell);
        }
        document.getElementById('score').textContent = score;
        if (score > best) { best = score; document.getElementById('best').textContent = best; }
    }

    function slide(row) {
        let arr = row.filter(v=>v), merged = false, pts = 0;
        for (let i=0;i<arr.length-1;i++) {
            if (arr[i]===arr[i+1]) {
                arr[i]*=2; pts+=arr[i]; arr.splice(i+1,1); merged=true;
            }
        }
        while(arr.length<4) arr.push(0);
        return { row: arr, pts, moved: arr.some((v,i)=>v!==row[i]) };
    }

    function move(dir) {
        prevGrid = grid.map(r=>[...r]); prevScore = score;
        let moved = false, pts = 0;
        let g = grid.map(r=>[...r]);

        if (dir==='left') {
            for (let r=0;r<4;r++) { const res=slide(g[r]); g[r]=res.row; pts+=res.pts; if(res.moved)moved=true; }
        } else if (dir==='right') {
            for (let r=0;r<4;r++) { const res=slide([...g[r]].reverse()); g[r]=res.row.reverse(); pts+=res.pts; if(res.moved)moved=true; }
        } else if (dir==='up') {
            for (let c=0;c<4;c++) { const res=slide([g[0][c],g[1][c],g[2][c],g[3][c]]); for(let r=0;r<4;r++)g[r][c]=res.row[r]; pts+=res.pts; if(res.moved)moved=true; }
        } else if (dir==='down') {
            for (let c=0;c<4;c++) { const res=slide([g[3][c],g[2][c],g[1][c],g[0][c]]); const rr=res.row.reverse(); for(let r=0;r<4;r++)g[r][c]=rr[r]; pts+=res.pts; if(res.moved)moved=true; }
        }

        if (moved) {
            grid = g; score += pts;
            addRandom(); render();
            if (!canMove()) {
                document.getElementById('msgText').textContent = score >= 1024 ? 'You Win!' : 'Game Over';
                document.getElementById('msg').classList.add('show');
            }
        }
    }

    function canMove() {
        for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
            if (!grid[r][c]) return true;
            if (c<3 && grid[r][c]===grid[r][c+1]) return true;
            if (r<3 && grid[r][c]===grid[r+1][c]) return true;
        }
        return false;
    }

    document.addEventListener('keydown', e => {
        const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
        if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });

    let tx, ty;
    document.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; });
    document.addEventListener('touchend', e => {
        const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
        if (Math.abs(dx)<20&&Math.abs(dy)<20) return;
        if (Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
        else move(dy>0?'down':'up');
    });

    newGame();
    </script>
</body>
</html>
