<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonogram</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#fff}
        a.back{position:fixed;top:1rem;left:1rem;color:#888;text-decoration:none;font-size:.9rem}
        a.back:hover{color:#fff}
        h1{font-size:2rem;margin-bottom:.5rem}
        #status{font-size:1rem;color:#aaa;margin-bottom:1rem}
        #board{display:inline-grid;gap:0}
        .col-hint{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:2px 4px;font-size:.75rem;color:#aaa;font-weight:bold;line-height:1.3}
        .row-hint{display:flex;align-items:center;justify-content:flex-end;padding:2px 6px;font-size:.75rem;color:#aaa;font-weight:bold;gap:6px}
        .cell{width:30px;height:30px;background:#2a2a4a;border:1px solid #333;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#666}
        .cell.filled{background:#6c63ff;border-color:#5a52d5}
        .cell.x{color:#f43f5e}
        .cell.correct{background:#4ade80}
        .cell.wrong{background:rgba(239,68,68,.3)}
        .btn-row{margin-top:1rem;display:flex;gap:.6rem}
        .btn-row button{padding:.4rem 1rem;border:none;background:rgba(255,255,255,.1);color:#fff;border-radius:6px;cursor:pointer;font-size:.85rem}
        .btn-row button.active{background:#6c63ff}
    </style>
</head>
<body>
    <a class="back" href="index.html">&larr; Menu</a>
    <h1>Nonogram</h1>
    <div id="status">Left click: Fill | Right click: Mark X</div>
    <div id="board"></div>
    <div class="btn-row">
        <button onclick="gen(5)">5x5</button>
        <button onclick="gen(10)" class="active">10x10</button>
        <button onclick="check()">Check</button>
    </div>
    <script>
    let size,solution,board;
    function gen(s){
        size=s;
        document.querySelectorAll('.btn-row button').forEach(b=>b.classList.remove('active'));
        document.querySelector(`.btn-row button[onclick="gen(${s})"]`).classList.add('active');
        solution=Array.from({length:size},()=>Array.from({length:size},()=>Math.random()>.5?1:0));
        board=Array.from({length:size},()=>Array(size).fill(0));
        render();
    }
    function getHints(arr){
        const hints=[];let cnt=0;
        for(let i=0;i<arr.length;i++){if(arr[i])cnt++;else if(cnt){hints.push(cnt);cnt=0;}}
        if(cnt)hints.push(cnt);
        return hints.length?hints:[0];
    }
    function render(){
        const el=document.getElementById('board');el.innerHTML='';

        // Collect all hints
        const colHints=[];
        let maxCH=0;
        for(let c=0;c<size;c++){
            const h=getHints(solution.map(r=>r[c]));
            colHints.push(h);
            if(h.length>maxCH)maxCH=h.length;
        }
        const rowHints=[];
        let maxRH=0;
        for(let r=0;r<size;r++){
            const h=getHints(solution[r]);
            rowHints.push(h);
            if(h.length>maxRH)maxRH=h.length;
        }

        // CSS grid: (maxRH cols for row-hint) + (size cols for cells)
        //           (maxCH rows for col-hint) + (size rows for cells)
        el.style.gridTemplateColumns=`repeat(${maxRH}, 28px) repeat(${size}, 30px)`;
        el.style.gridTemplateRows=`repeat(${maxCH}, 28px) repeat(${size}, 30px)`;

        // 1) Fill top-left corner area with empty divs
        for(let r=0;r<maxCH;r++){
            for(let c=0;c<maxRH;c++){
                const d=document.createElement('div');
                el.appendChild(d);
            }
        }

        // 2) Column hints (top area, spanning maxRH..maxRH+size-1 columns)
        // Place each col-hint in row r (top to bottom), col (maxRH+c)
        for(let r=0;r<maxCH;r++){
            for(let c=0;c<size;c++){
                const d=document.createElement('div');
                d.className='col-hint';
                const h=colHints[c];
                // We want to show hints bottom-aligned: the last hint goes in the bottom row
                const hintIdx=h.length-1-(maxCH-1-r);
                if(hintIdx>=0&&hintIdx<h.length){
                    d.textContent=h[hintIdx];
                }
                el.appendChild(d);
            }
        }

        // 3) Row hints + puzzle cells (remaining maxRH+size rows)
        for(let r=0;r<size;r++){
            // Row hints
            for(let c=0;c<maxRH;c++){
                const d=document.createElement('div');
                d.className='row-hint';
                const h=rowHints[r];
                // Left-align: first hint in leftmost column
                if(c<h.length){
                    d.textContent=h[c];
                }
                el.appendChild(d);
            }
            // Puzzle cells
            for(let c=0;c<size;c++){
                const d=document.createElement('div');d.className='cell';
                if(board[r][c]===1)d.classList.add('filled');
                if(board[r][c]===-1){d.classList.add('x');d.textContent='✕';}
                d.onclick=()=>{board[r][c]=board[r][c]===0?1:board[r][c]===1?-1:0;render();};
                d.oncontextmenu=e=>{e.preventDefault();board[r][c]=board[r][c]===0?-1:board[r][c]===-1?0:board[r][c];render();};
                el.appendChild(d);
            }
        }
    }
    function check(){
        const cells=document.querySelectorAll('#board .cell');
        let idx=0;
        for(let r=0;r<size;r++)for(let c=0;c<size;c++){
            const cell=cells[idx++];
            if(board[r][c]===1&&solution[r][c]===1)cell.classList.add('correct');
            else if(board[r][c]===1&&solution[r][c]===0)cell.classList.add('wrong');
            else if(board[r][c]===0&&solution[r][c]===1)cell.style.outline='1px solid #facc15';
        }
    }
    gen(10);
    </script>
</body>
</html>
