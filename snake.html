<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        a.back { position: fixed; top: 1rem; left: 1rem; color: #888; text-decoration: none; font-size: 0.9rem; }
        a.back:hover { color: #fff; }
        .header { display: flex; gap: 2rem; margin-bottom: 1.5rem; align-items: center; }
        .header h1 { font-size: 2rem; }
        .info { font-size: 1.1rem; }
        .info span { font-weight: bold; }
        canvas { border: 2px solid #444; border-radius: 4px; background: #0a0a1a; display: block; }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 6px;
            margin-top: 1.5rem;
        }
        .controls button {
            width: 60px; height: 60px;
            border: none; background: rgba(255,255,255,0.1);
            color: #fff; font-size: 1.5rem; border-radius: 10px; cursor: pointer;
        }
        .controls button:active { background: rgba(255,255,255,0.25); }
        .controls .empty { visibility: hidden; }
        .btn-row { margin-top: 1rem; }
        .btn-row button {
            padding: 0.5rem 1.5rem; font-size: 0.9rem; border: none;
            background: rgba(255,255,255,0.1); color: #fff;
            border-radius: 6px; cursor: pointer; margin: 0 0.3rem;
        }
        .btn-row button:hover { background: rgba(255,255,255,0.2); }
        #overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.8); flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        #overlay.show { display: flex; }
        #overlay h2 { font-size: 2rem; margin-bottom: 0.5rem; }
        #overlay p { color: #aaa; margin-bottom: 1.5rem; font-size: 1.1rem; }
        #overlay button {
            padding: 0.7rem 2rem; font-size: 1rem; border: none;
            background: #6c63ff; color: #fff; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>
    <a class="back" href="index.html">&larr; Menu</a>
    <div class="header">
        <h1>Snake</h1>
        <div class="info">Score: <span id="score">0</span></div>
        <div class="info">Best: <span id="best">0</span></div>
    </div>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="controls">
        <div class="empty"></div>
        <button onclick="setDir(0,-1)">&uarr;</button>
        <div class="empty"></div>
        <button onclick="setDir(-1,0)">&larr;</button>
        <button onclick="setDir(0,1)">&darr;</button>
        <button onclick="setDir(1,0)">&rarr;</button>
    </div>
    <div class="btn-row">
        <button onclick="togglePause()">Pause</button>
        <button onclick="startGame()">Restart</button>
    </div>
    <div id="overlay">
        <h2 id="ovTitle">Game Over</h2>
        <p id="ovScore"></p>
        <button onclick="startGame()">Play Again</button>
    </div>

    <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const GRID = 20, CELL = 20;
    let snake, dir, nextDir, food, score, best = 0, gameLoop, paused = false, running = false;

    function startGame() {
        snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
        dir = {x:1,y:0}; nextDir = {x:1,y:0};
        score = 0; paused = false; running = true;
        document.getElementById('score').textContent = 0;
        document.getElementById('overlay').classList.remove('show');
        placeFood();
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(tick, 120);
    }

    function placeFood() {
        do {
            food = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
        } while (snake.some(s => s.x===food.x && s.y===food.y));
    }

    function tick() {
        if (paused || !running) return;
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // Wall collision
        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return endGame();
        // Self collision
        if (snake.some(s => s.x === head.x && s.y === head.y)) return endGame();

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('score').textContent = score;
            placeFood();
        } else {
            snake.pop();
        }
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid
        ctx.strokeStyle = '#15152a';
        for (let i = 0; i <= GRID; i++) {
            ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,GRID*CELL); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(GRID*CELL,i*CELL); ctx.stroke();
        }

        // Snake
        snake.forEach((s, i) => {
            const ratio = 1 - i / snake.length;
            const g = Math.floor(180 + 75 * ratio);
            ctx.fillStyle = i === 0 ? '#4ade80' : `rgb(22, ${g}, 80)`;
            ctx.beginPath();
            ctx.roundRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2, 4);
            ctx.fill();
        });

        // Eyes on head
        const h = snake[0];
        ctx.fillStyle = '#fff';
        const ex = dir.x === 0 ? 4 : (dir.x > 0 ? 6 : 2);
        const ey = dir.y === 0 ? 4 : (dir.y > 0 ? 6 : 2);
        ctx.beginPath(); ctx.arc(h.x*CELL+ex+2, h.y*CELL+ey, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(h.x*CELL+CELL-ex-2, h.y*CELL+ey, 2, 0, Math.PI*2); ctx.fill();

        // Food
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(food.x*CELL+CELL/2-2, food.y*CELL+CELL/2-2, 2, 0, Math.PI*2);
        ctx.fill();
    }

    function endGame() {
        running = false;
        clearInterval(gameLoop);
        if (score > best) { best = score; document.getElementById('best').textContent = best; }
        document.getElementById('ovTitle').textContent = 'Game Over';
        document.getElementById('ovScore').textContent = 'Score: ' + score;
        document.getElementById('overlay').classList.add('show');
    }

    function setDir(x, y) {
        if (x === -dir.x && y === -dir.y) return;
        nextDir = {x, y};
    }

    function togglePause() {
        if (!running) return;
        paused = !paused;
    }

    document.addEventListener('keydown', e => {
        const map = {
            ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
            w: [0,-1], s: [0,1], a: [-1,0], d: [1,0]
        };
        if (map[e.key]) { e.preventDefault(); setDir(...map[e.key]); }
    });

    // Touch swipe
    let tx, ty;
    canvas.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; });
    canvas.addEventListener('touchend', e => {
        const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
        if (Math.abs(dx)<15&&Math.abs(dy)<15) return;
        if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1, 0);
        else setDir(0, dy>0?1:-1);
    });

    startGame();
    </script>
</body>
</html>
