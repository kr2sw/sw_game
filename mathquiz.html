<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#fff}
        a.back{position:fixed;top:1rem;left:1rem;color:#888;text-decoration:none;font-size:.9rem}
        a.back:hover{color:#fff}
        .container{text-align:center;max-width:400px;width:100%;padding:0 1rem}
        h1{font-size:2rem;margin-bottom:1rem}
        .stats{display:flex;gap:2rem;justify-content:center;margin-bottom:1.5rem;font-size:1.1rem}
        .stats span{font-weight:bold}
        .question{font-size:3rem;margin:1rem 0 2rem;font-family:monospace;min-height:60px}
        .question .op{color:#facc15}
        #input{width:200px;padding:.8rem;font-size:2rem;text-align:center;border:2px solid #444;border-radius:12px;background:rgba(255,255,255,.07);color:#fff;outline:none;font-family:monospace}
        #input:focus{border-color:#6c63ff}
        .feedback{font-size:1.3rem;margin:1rem 0;min-height:40px}
        .feedback.correct{color:#4ade80}
        .feedback.wrong{color:#f43f5e}
        .btn-row{display:flex;gap:.8rem;justify-content:center;margin-top:1rem}
        .btn-row button{padding:.6rem 1.5rem;border:none;background:#6c63ff;color:#fff;border-radius:8px;cursor:pointer;font-size:1rem}
        .btn-row button:hover{background:#5a52d5}
        .timer-bar{width:100%;height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin-bottom:1rem}
        .timer-fill{height:100%;border-radius:4px;transition:width .1s linear}
        .modes{display:flex;gap:.6rem;justify-content:center;margin-bottom:1.5rem}
        .modes button{padding:.4rem 1rem;border:none;background:rgba(255,255,255,.1);color:#fff;border-radius:6px;cursor:pointer;font-size:.85rem}
        .modes button.active{background:#6c63ff}
    </style>
</head>
<body>
    <a class="back" href="index.html">&larr; Menu</a>
    <div class="container">
        <h1>Math Quiz</h1>
        <div class="modes">
            <button class="active" onclick="setMode('add',this)">Add</button>
            <button onclick="setMode('sub',this)">Sub</button>
            <button onclick="setMode('mul',this)">Mul</button>
            <button onclick="setMode('mix',this)">Mix</button>
        </div>
        <div class="stats">
            <span>Score: <span id="score">0</span></span>
            <span>Streak: <span id="streak">0</span></span>
            <span>Time: <span id="time">30</span>s</span>
        </div>
        <div class="timer-bar"><div class="timer-fill" id="tf" style="width:100%;background:#6c63ff"></div></div>
        <div class="question" id="q"></div>
        <input id="input" type="number" autocomplete="off" autofocus>
        <div class="feedback" id="fb"></div>
        <div class="btn-row">
            <button onclick="startGame()">Start</button>
        </div>
    </div>
    <script>
    let mode='add',a,b,op,answer,score,streak,timer,timerInterval;
    function setMode(m,btn){mode=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
    function genQuestion(){
        if(mode==='add'||mode==='sub'){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*50)+1;}
        else{a=Math.floor(Math.random()*12)+1;b=Math.floor(Math.random()*12)+1;}
        let ops=['+','-','×'];
        if(mode==='add')ops=['+'];else if(mode==='sub')ops=['-'];else if(mode==='mul')ops=['×'];
        op=ops[Math.floor(Math.random()*ops.length)];
        if(op==='+'||op==='-'){
            if(op==='-'&&a<b)[a,b]=[b,a];
            answer=op==='+'?a+b:a-b;
        }else{answer=a*b;}
        document.getElementById('q').innerHTML=`${a} <span class="op">${op}</span> ${b} = ?`;
    }
    function startGame(){
        score=0;streak=0;timer=30;
        document.getElementById('score').textContent=0;document.getElementById('streak').textContent=0;document.getElementById('time').textContent=30;
        document.getElementById('input').value='';document.getElementById('fb').textContent='';
        document.getElementById('tf').style.width='100%';
        genQuestion();
        clearInterval(timerInterval);
        timerInterval=setInterval(()=>{
            timer--;document.getElementById('time').textContent=timer;
            document.getElementById('tf').style.width=(timer/30*100)+'%';
            document.getElementById('tf').style.background=timer<=10?'#f43f5e':'#6c63ff';
            if(timer<=0){clearInterval(timerInterval);document.getElementById('fb').textContent='Time up! Score: '+score;document.getElementById('fb').className='feedback';}
        },1000);
        document.getElementById('input').focus();
    }
    document.getElementById('input').addEventListener('keydown',e=>{
        if(e.key==='Enter'){
            const val=parseInt(document.getElementById('input').value);
            const fb=document.getElementById('fb');
            if(isNaN(val))return;
            if(val===answer){
                score++;streak++;fb.textContent='Correct!';fb.className='feedback correct';
            }else{
                fb.textContent=`Wrong! ${a} ${op} ${b} = ${answer}`;fb.className='feedback wrong';streak=0;
            }
            document.getElementById('score').textContent=score;
            document.getElementById('streak').textContent=streak;
            document.getElementById('input').value='';
            if(timer>0)genQuestion();
        }
    });
    startGame();
    </script>
</body>
</html>
