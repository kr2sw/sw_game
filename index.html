<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 3rem;
        }
        .games {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-card {
            width: 220px;
            padding: 2rem 1.5rem;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            background: rgba(255,255,255,0.12);
        }
        .game-card .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .game-card h2 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }
        .game-card p {
            font-size: 0.85rem;
            color: #bbb;
        }
    </style>
</head>
<body>
    <h1>SW Game</h1>
    <p class="subtitle">choose a game to play</p>
    <div class="games">
        <a class="game-card" href="tetris.html">
            <div class="icon">&#x1F3AE;</div>
            <h2>Tetris</h2>
            <p>Classic block-stacking puzzle game</p>
        </a>
        <a class="game-card" href="1024.html">
            <div class="icon">&#x1F522;</div>
            <h2>1024</h2>
            <p>Slide and merge numbers</p>
        </a>
        <a class="game-card" href="snake.html">
            <div class="icon">&#x1F40D;</div>
            <h2>Snake</h2>
            <p>Grow your snake, eat the food</p>
        </a>
    </div>
</body>
</html>
