<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#fff}
        a.back{position:fixed;top:1rem;left:1rem;color:#888;text-decoration:none;font-size:.9rem}
        a.back:hover{color:#fff}
        .header{display:flex;gap:2rem;margin-bottom:1rem;align-items:center}
        .header h1{font-size:2rem}
        .info{font-size:1.1rem}
        .info span{font-weight:bold}
        canvas{border:2px solid #444;border-radius:4px;background:#0a0a1a}
        .hint{margin-top:1rem;font-size:.8rem;color:#666}
    </style>
</head>
<body>
    <a class="back" href="index.html">&larr; Menu</a>
    <div class="header">
        <h1>Pong</h1>
        <div class="info">Player: <span id="p1">0</span></div>
        <div class="info">CPU: <span id="p2">0</span></div>
    </div>
    <canvas id="c" width="600" height="400"></canvas>
    <p class="hint">W/S or Mouse to move, first to 10 wins</p>
    <script>
    const c=document.getElementById('c'),ctx=c.getContext('2d');
    const W=600,H=400,PW=12,PH=80;
    let py=H/2-PH/2,ay=H/2-PH/2,by=H/2,bx=3,vx=4,vy=3,ps=0,as=0,winner=null;
    let mouseY=H/2;
    c.addEventListener('mousemove',e=>{mouseY=e.offsetY;});
    document.addEventListener('keydown',e=>{
        if(e.key==='r'){reset();}
    });
    function reset(){by=H/2;bx=3;vx=4*(Math.random()>0.5?1:-1);vy=3*(Math.random()>0.5?1:-1);}
    function loop(){
        if(winner){draw();requestAnimationFrame(loop);return;}
        py+=(mouseY-PH/2-py)*0.1;
        ay+=(by-PH/2-ay)*0.06;
        bx+=vx;by+=vy;
        if(by<=0||by>=H){vy=-vy;by=Math.max(0,Math.min(H,by));}
        // Paddle collision
        if(bx-PW/2<=20&&by>=py&&by<=py+PH&&vx<0){vx=-vx*1.05;vy+=(by-(py+PH/2))*0.1;}
        if(bx+PW/2>=W-20&&by>=ay&&by<=ay+PH&&vx>0){vx=-vx*1.05;vy+=(by-(ay+PH/2))*0.1;}
        // Score
        if(bx<0){as++;document.getElementById('p2').textContent=as;reset();}
        if(bx>W){ps++;document.getElementById('p1').textContent=ps;reset();}
        if(ps>=10)winner='Player Wins!';
        if(as>=10)winner='CPU Wins!';
        draw();
        requestAnimationFrame(loop);
    }
    function draw(){
        ctx.clearRect(0,0,W,H);
        // Center line
        ctx.setLineDash([8,8]);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
        // Paddles
        ctx.fillStyle='#6c63ff';ctx.fillRect(14,py,8,PH);
        ctx.fillStyle='#f43f5e';ctx.fillRect(W-22,ay,8,PH);
        // Ball
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,PW/2,0,Math.PI*2);ctx.fill();
        // Ball trail
        ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(bx-vx,by-vy,PW/2-1,0,Math.PI*2);ctx.fill();
        if(winner){
            ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
            ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.textAlign='center';
            ctx.fillText(winner,W/2,H/2);ctx.font='20px sans-serif';ctx.fillText('Press R to restart',W/2,H/2+40);
            ctx.textAlign='start';
        }
    }
    loop();
    </script>
</body>
</html>
